<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <h1>Animated Loader</h1>
    <div class="container">
        <div class="card">
            <h2>Message Loader</h2>
            <div class="msg-loader">
                <div class="bubble">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
        <div class="card">
            <h2>Code Loader</h2>
            <div class="code-loader">
                <span class="left">{</span>
                <span class="right">}</span>
            </div>
        </div>
        <div class="card">
            <h2>Music Loader</h2>
            <div class="music-loader">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <div class="card">
            <h2>Dots Loader</h2> 
            <div class="dots-loader">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <div class="card">
            <h2>Ben 10 Loader</h2>
            <div class="ben-loader">
                <div class="circle">
                <div class="part part1"></div>
                <div class="part part2"></div>
                <div class="part part3"></div>
                <div class="part part4"></div>
                </div>
            </div>
        </div>
        <div class="card">
            <h2>Hacker Loader</h2>
            <div class="hacker-loader">
                LOADING
            </div>
        </div>
    </div>
</body>
</html>
